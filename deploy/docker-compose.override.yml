# SENTRY SELF-HOSTED — deploy
# Uses official getsentry/self-hosted (release 26.8.0).
# Base docker-compose.yml comes from the repo (git clone + ./install.sh);
# this override adds a MailHog dev/sandbox mailcatcher for alert emails.
#
# Host: 192.168.50.42
# UI:    http://192.168.50.42:9000
# Mail:  http://192.168.50.42:8025 (MailHog UI), SMTP 192.168.50.42:1025
services:
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - default